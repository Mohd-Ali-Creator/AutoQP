name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Typecheck, Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.2   # matches packageManager in root package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # -- Typecheck ------------------------------------------------------------
      - name: Typecheck (all packages)
        run: pnpm typecheck

      # -- Tests ----------------------------------------------------------------
      - name: Test (all packages)
        run: pnpm test

      # -- Lint -----------------------------------------------------------------
      - name: Lint (web)
        run: pnpm --filter web lint
